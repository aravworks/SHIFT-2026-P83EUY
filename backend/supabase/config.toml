project_id = "voltmesh"

[api]
port = 54321

[db]
port = 54322
major_version = 15

[functions.provision]
verify_jwt = false # called by the app at first launch, before it has any session

[functions.ingest]
verify_jwt = false # demo-grade; production: per-device keys / signed requests

[functions.sos]
verify_jwt = false

[functions.vehicle]
verify_jwt = false # authenticated by per-vehicle x-api-key instead

[functions.admin]
verify_jwt = true  # admin portal sessions only (role also checked in code)

[functions.help]
verify_jwt = false # phones authenticate with an HMAC signature (demo-grade, like mesh packets)
